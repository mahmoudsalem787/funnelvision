<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="gSrc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#64748b"/><stop offset="1" stop-color="#334155"/></linearGradient>
    <linearGradient id="gSnow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#0369a1"/></linearGradient>
    <linearGradient id="gStg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fb923c"/><stop offset="1" stop-color="#c2410c"/></linearGradient>
    <linearGradient id="gInt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f97316"/><stop offset="1" stop-color="#9a3412"/></linearGradient>
    <linearGradient id="gMart" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#facc15"/><stop offset="1" stop-color="#a16207"/></linearGradient>
    <linearGradient id="gApp" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fb7185"/><stop offset="1" stop-color="#be123c"/></linearGradient>
    <linearGradient id="gAir" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#0f766e"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#e2e8f0"/>
    </marker>
    <marker id="arrowT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5eead4"/>
    </marker>
  </defs>

  <style>
    .flow   { stroke: #e2e8f0; stroke-width: 3; fill: none; stroke-dasharray: 8 8; animation: dash 1s linear infinite; }
    .ctrl   { stroke: #5eead4; stroke-width: 2.5; fill: none; stroke-dasharray: 5 7; animation: dash 1.4s linear infinite; }
    .node   { animation: float 4s ease-in-out infinite; }
    .n2 { animation-delay: .4s } .n3 { animation-delay: .8s } .n4 { animation-delay: 1.2s } .n5 { animation-delay: 1.6s } .n6 { animation-delay: 2s }
    .t1 { fill: #fff; font-size: 20px; font-weight: 700; text-anchor: middle; }
    .t2 { fill: #f1f5f9; font-size: 13px; text-anchor: middle; opacity: .95; }
    .cap { fill: #cbd5e1; font-size: 13px; text-anchor: middle; }
    .badge { fill: #0ea5e9; }
    .btxt { fill: #fff; font-size: 11px; font-weight: 700; text-anchor: middle; }
    .glow { animation: pulse 2.4s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes dash  { to { stroke-dashoffset: -32; } }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @keyframes pulse { 0%,100% { opacity: .25; transform: scale(1); } 50% { opacity: .7; transform: scale(1.06); } }
  </style>

  <!-- background -->
  <rect width="1280" height="560" rx="24" fill="url(#bg)"/>

  <!-- title -->
  <text x="40" y="58" fill="#fff" font-size="30" font-weight="800">FunnelVision</text>
  <text x="40" y="84" fill="#94a3b8" font-size="15">Snowflake · dbt · Airflow · Docker · Streamlit</text>

  <!-- Airflow orchestrator -->
  <g class="node n2" filter="url(#shadow)">
    <rect class="glow" x="450" y="40" width="620" height="92" rx="18" fill="#2dd4bf"/>
    <rect x="450" y="40" width="620" height="92" rx="18" fill="url(#gAir)"/>
    <text x="760" y="82" class="t1">Airflow DAG · runs daily</text>
    <text x="760" y="106" class="t2">dbt run  →  dbt test   (funnelvision_dbt_daily)</text>
    <rect class="badge" x="466" y="52" width="62" height="20" rx="10"/>
    <text x="497" y="66" class="btxt">Docker</text>
  </g>

  <!-- control arrows from Airflow -->
  <path class="ctrl" d="M535 132 V248" marker-end="url(#arrowT)"/>
  <path class="ctrl" d="M745 132 V248" marker-end="url(#arrowT)"/>
  <path class="ctrl" d="M955 132 V248" marker-end="url(#arrowT)"/>

  <!-- data flow arrows -->
  <path id="p1" class="flow" d="M190 305 H246" marker-end="url(#arrow)"/>
  <path id="p2" class="flow" d="M400 305 H456" marker-end="url(#arrow)"/>
  <path id="p3" class="flow" d="M610 305 H666" marker-end="url(#arrow)"/>
  <path id="p4" class="flow" d="M820 305 H876" marker-end="url(#arrow)"/>
  <path id="p5" class="flow" d="M1030 305 H1086" marker-end="url(#arrow)"/>

  <!-- moving data packets -->
  <g fill="#fde047">
    <circle r="5"><animateMotion dur="1.6s" repeatCount="indefinite" path="M190 305 H246"/></circle>
    <circle r="5"><animateMotion dur="1.6s" begin="0.3s" repeatCount="indefinite" path="M400 305 H456"/></circle>
    <circle r="5"><animateMotion dur="1.6s" begin="0.6s" repeatCount="indefinite" path="M610 305 H666"/></circle>
    <circle r="5"><animateMotion dur="1.6s" begin="0.9s" repeatCount="indefinite" path="M820 305 H876"/></circle>
    <circle r="5"><animateMotion dur="1.6s" begin="1.2s" repeatCount="indefinite" path="M1030 305 H1086"/></circle>
  </g>

  <!-- nodes -->
  <g class="node" filter="url(#shadow)">
    <rect x="40" y="250" width="150" height="110" rx="18" fill="url(#gSrc)"/>
    <text x="115" y="296" class="t1">CSV files</text>
    <text x="115" y="320" class="t2">Maven Fuzzy</text>
    <text x="115" y="338" class="t2">Factory (6 files)</text>
  </g>

  <g class="node n2" filter="url(#shadow)">
    <rect x="250" y="250" width="150" height="110" rx="18" fill="url(#gSnow)"/>
    <text x="325" y="296" class="t1">Snowflake</text>
    <text x="325" y="320" class="t2">RAW schema</text>
    <text x="325" y="338" class="t2">1.7M rows</text>
  </g>

  <g class="node n3" filter="url(#shadow)">
    <rect x="460" y="250" width="150" height="110" rx="18" fill="url(#gStg)"/>
    <text x="535" y="296" class="t1">Staging</text>
    <text x="535" y="320" class="t2">dbt · 6 views</text>
    <text x="535" y="338" class="t2">clean + cast</text>
  </g>

  <g class="node n4" filter="url(#shadow)">
    <rect x="670" y="250" width="150" height="110" rx="18" fill="url(#gInt)"/>
    <text x="745" y="296" class="t1">Intermediate</text>
    <text x="745" y="320" class="t2">dbt · 2 views</text>
    <text x="745" y="338" class="t2">joins + logic</text>
  </g>

  <g class="node n5" filter="url(#shadow)">
    <rect x="880" y="250" width="150" height="110" rx="18" fill="url(#gMart)"/>
    <text x="955" y="296" class="t1">Marts</text>
    <text x="955" y="320" class="t2">3 facts + 3 dims</text>
    <text x="955" y="338" class="t2">star schema</text>
  </g>

  <g class="node n6" filter="url(#shadow)">
    <rect class="glow" x="1090" y="250" width="150" height="110" rx="18" fill="#fb7185"/>
    <rect x="1090" y="250" width="150" height="110" rx="18" fill="url(#gApp)"/>
    <text x="1165" y="296" class="t1">Streamlit</text>
    <text x="1165" y="320" class="t2">4 KPIs · 3 charts</text>
    <text x="1165" y="338" class="t2">localhost:8501</text>
    <rect class="badge" x="1134" y="226" width="62" height="20" rx="10"/>
    <text x="1165" y="240" class="btxt">Docker</text>
  </g>

  <!-- captions -->
  <text x="115" y="392" class="cap">Source</text>
  <text x="325" y="392" class="cap">Storage</text>
  <text x="535" y="392" class="cap">Transform</text>
  <text x="745" y="392" class="cap">Transform</text>
  <text x="955" y="392" class="cap">Serve</text>
  <text x="1165" y="392" class="cap">Visualize</text>

  <!-- tests banner -->
  <g>
    <rect x="460" y="420" width="570" height="44" rx="22" fill="#14532d" stroke="#4ade80" stroke-width="2"/>
    <text x="745" y="448" fill="#bbf7d0" font-size="15" font-weight="700" text-anchor="middle">✔ 25 dbt tests: not_null · unique · relationships</text>
  </g>

  <!-- legend -->
  <g font-size="13" fill="#cbd5e1">
    <path d="M40 510 H90" stroke="#e2e8f0" stroke-width="3" stroke-dasharray="8 8"/>
    <text x="102" y="515">Data flow</text>
    <path d="M220 510 H270" stroke="#5eead4" stroke-width="2.5" stroke-dasharray="5 7"/>
    <text x="282" y="515">Airflow orchestration</text>
    <rect x="470" y="500" width="62" height="20" rx="10" fill="#0ea5e9"/>
    <text x="501" y="514" class="btxt">Docker</text>
    <text x="544" y="515">Runs in Docker Compose</text>
  </g>
</svg>
